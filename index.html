<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DERIV CRASH & BOOM AUTOMATED BOT</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Global via CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel untuk kompilasi JSX langsung di browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: white; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glossy-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .glossy-input:focus { outline: none; border-color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.3), inset 0 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destrukturisasi hooks dari object React global
        const { useState, useEffect, useRef } = React;

        // --- LUCIDE ICONS (SVG Murni agar aman di single-file) ---
        const IconWifi = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>;
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconSquare = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>;
        const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconZap = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;

        function App() {
            // -- State: API & Connection --
            const [apiToken, setApiToken] = useState("");
            const [appId, setAppId] = useState("");
            const [connStatus, setConnStatus] = useState("Disconnected");
            const [isBotRunning, setIsBotRunning] = useState(false);

            // -- State: Market & Strategy --
            const [market, setMarket] = useState("Crash 300");
            const [strategy, setStrategy] = useState("1");
            const [stake, setStake] = useState(1.00);
            const [martingale, setMartingale] = useState(false);
            const [maxStep, setMaxStep] = useState(3);
            const [tp, setTp] = useState(50);
            const [sl, setSl] = useState(20);

            // -- State: Data & Logs --
            const [balance, setBalance] = useState(0);
            const [currency, setCurrency] = useState("USD");
            const [logs, setLogs] = useState([]);
            const [chartData, setChartData] = useState(Array.from({ length: 40 }, () => 0));

            // -- State: Bot Engine Visualizer --
            const [signal, setSignal] = useState("STANDBY");
            const [consecutiveTicks, setConsecutiveTicks] = useState(0);

            // -- References --
            const wsRef = useRef(null);
            const latestPriceRef = useRef(null);
            const isTradingRef = useRef(false);
            const activeContractRef = useRef(null);
            const stateRef = useRef({ market, strategy, stake, isBotRunning });

            // Update stateRef 
            useEffect(() => {
                stateRef.current = { market, strategy, stake, isBotRunning };
            }, [market, strategy, stake, isBotRunning]);

            // Cleanup
            useEffect(() => {
                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, []);

            // Stats
            const totalTrades = logs.length;
            const wins = logs.filter(l => l.result === 'WIN').length;
            const winRate = totalTrades === 0 ? 0 : ((wins / totalTrades) * 100).toFixed(1);
            const totalNetProfit = logs.reduce((acc, curr) => acc + curr.profit, 0);

            const getMarketSymbol = (marketName) => {
                const symbolMap = {
                    "Crash 300": "CRASH300N", "Crash 500": "CRASH500N", "Crash 1000": "CRASH1000N",
                    "Boom 500": "BOOM500N", "Boom 1000": "BOOM1000N"
                };
                return symbolMap[marketName] || "CRASH300N";
            };

            const handleConnect = () => {
                if (!apiToken || !appId) {
                    alert("Masukkan API Token dan App ID dari akun Deriv Anda (Demo disarankan).");
                    return;
                }
                setConnStatus("Connecting...");
                if(wsRef.current) wsRef.current.close();
                
                const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);
                wsRef.current = ws;

                ws.onopen = () => { ws.send(JSON.stringify({ authorize: apiToken })); };

                ws.onmessage = (evt) => {
                    const res = JSON.parse(evt.data);
                    if (res.error) {
                        setSignal(`ERROR: ${res.error.message}`);
                        if (res.msg_type === 'authorize') setConnStatus("Auth Failed");
                        return;
                    }
                    
                    if (res.msg_type === 'authorize') {
                        setConnStatus("Connected");
                        setCurrency(res.authorize.currency);
                        ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                        ws.send(JSON.stringify({ ticks: getMarketSymbol(stateRef.current.market), subscribe: 1 }));
                    }

                    if (res.msg_type === 'balance') {
                        setBalance(res.balance.balance);
                    }

                    if (res.msg_type === 'tick') {
                        const price = res.tick.quote;
                        setChartData(prev => {
                            const isAllZero = prev.every(v => v === 0);
                            const newData = isAllZero ? Array.from({ length: 40 }, () => price) : [...prev.slice(1), price];
                            return newData;
                        });
                        processBotLogic(price);
                    }

                    if (res.msg_type === 'buy') {
                        activeContractRef.current = res.buy.contract_id;
                        const cost = res.buy.buy_price;
                        addLog(`EXEC BUY (${stateRef.current.market})`, "-", "PENDING", -cost);
                    }
                };

                ws.onclose = () => {
                    setConnStatus("Disconnected");
                    setSignal("Koneksi API Terputus");
                    setIsBotRunning(false);
                };
            };

            const toggleBot = () => {
                if (connStatus === "Disconnected" || connStatus === "Auth Failed") {
                    alert("Koneksikan API (Auth Success) terlebih dahulu sebelum memulai Bot!");
                    return;
                }
                setIsBotRunning(!isBotRunning);
                setSignal(!isBotRunning ? "BOT STARTED - WAITING TICK..." : "STANDBY");
                if (!isBotRunning) {
                    setConnStatus("Live Trading");
                    setConsecutiveTicks(0);
                } else {
                    setConnStatus("Connected");
                }
            };

            const addLog = (action, isSpike, result, profitLoss) => {
                const newLog = {
                    id: Date.now() + Math.random(),
                    time: new Date().toLocaleTimeString(),
                    market: stateRef.current.market,
                    action, isSpike, result, profit: profitLoss
                };
                setLogs(prev => [newLog, ...prev]);
            };

            const executeTrade = (type) => {
                if (isTradingRef.current || !wsRef.current) return;
                isTradingRef.current = true;
                const symbol = getMarketSymbol(stateRef.current.market);
                const amount = stateRef.current.stake;
                
                wsRef.current.send(JSON.stringify({
                    buy: 1,
                    price: amount,
                    parameters: {
                        amount: amount,
                        basis: "stake",
                        contract_type: type, // CALL (Rise) / PUT (Fall)
                        currency: currency,
                        duration: 1,
                        duration_unit: "t",
                        symbol: symbol
                    }
                }));

                setTimeout(() => { isTradingRef.current = false; }, 2500);
            };

            const processBotLogic = (currentPrice) => {
                if (!latestPriceRef.current) { latestPriceRef.current = currentPrice; return; }
                
                const prevPrice = latestPriceRef.current;
                latestPriceRef.current = currentPrice;
                
                if (!stateRef.current.isBotRunning) return;

                const isBoom = stateRef.current.market.includes("Boom");
                const diff = currentPrice - prevPrice;
                
                let isSpike = false;
                if (isBoom && diff > 1.5) isSpike = true;
                if (!isBoom && diff < -1.5) isSpike = true;

                const normalAction = isBoom ? "PUT" : "CALL"; 
                const revAction = isBoom ? "CALL" : "PUT"; 

                if (stateRef.current.strategy === "1") {
                    if (isSpike) {
                        setSignal("SPIKE DETECTED! AUTO TP/CUT TRIGGERED");
                        if (activeContractRef.current && wsRef.current) {
                            wsRef.current.send(JSON.stringify({ sell: activeContractRef.current, price: 0 }));
                            activeContractRef.current = null;
                        }
                        setConsecutiveTicks(0);
                    } else {
                        setConsecutiveTicks(prev => prev + 1);
                        setSignal(`SCALPING ${normalAction} (Tick: ${consecutiveTicks + 1})`);
                        if ((consecutiveTicks + 1) % 2 === 0) executeTrade(normalAction);
                    }
                }
                else if (stateRef.current.strategy === "2") {
                    if (isSpike) setConsecutiveTicks(0); else setConsecutiveTicks(prev => prev + 1);
                    if (consecutiveTicks >= 5) {
                        setSignal(`REVERSAL OP ${revAction} EXECUTED!`);
                        executeTrade(revAction);
                        setConsecutiveTicks(0);
                    } else {
                        setSignal(`FOLLOW TREND (Tick: ${consecutiveTicks})`);
                    }
                }
                else if (stateRef.current.strategy === "3") {
                    if (isSpike) {
                        setSignal(`SPIKE CAUGHT! (Drop detected)`);
                    } else {
                        setConsecutiveTicks(prev => prev + 1);
                        setSignal(`WAITING SPIKE - PREPARING ${revAction}...`);
                        if (consecutiveTicks > 3) {
                            executeTrade(revAction);
                            setConsecutiveTicks(0);
                        }
                    }
                }
            };

            const renderChart = () => {
                const maxVal = Math.max(...chartData);
                const minVal = Math.min(...chartData);
                const range = maxVal - minVal || 1;
                
                return (
                    <div className="h-40 w-full flex items-end justify-between space-x-1 mt-4 border-b border-gray-600 pb-2">
                        {chartData.map((val, i) => {
                            const height = val === 0 ? 0 : Math.max(10, ((val - minVal) / range) * 100);
                            const prevVal = i > 0 ? chartData[i-1] : val;
                            const isDrop = val < prevVal;
                            return (
                                <div key={i} 
                                     className={`w-full rounded-t-sm transition-all duration-300 ease-out ${val === 0 ? 'bg-transparent' : isDrop ? 'bg-red-500' : 'bg-emerald-500'}`} 
                                     style={{ height: `${height}%` }}
                                     title={`Price: ${val}`}>
                                </div>
                            )
                        })}
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col gap-6 max-w-7xl mx-auto">
                    {/* TOP BAR */}
                    <div className="glass-panel rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between shadow-2xl relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-r from-yellow-600/10 to-transparent pointer-events-none"></div>
                        <div className="flex items-center gap-4 z-10 mb-4 md:mb-0">
                            <div className="p-3 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-xl shadow-lg">
                                <IconActivity />
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-white">
                                    DERIV CRASH & BOOM BOT v1.0
                                </h1>
                                <p className="text-sm text-gray-400">Automated Trading Engine</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center justify-center gap-3 z-10">
                            <input 
                                type="text" 
                                placeholder="App ID (e.g. 1089)" 
                                value={appId} onChange={e => setAppId(e.target.value)}
                                className="glossy-input rounded-lg px-4 py-2 w-32 text-sm text-center"
                            />
                            <input 
                                type="password" 
                                placeholder="Deriv API Token" 
                                value={apiToken} onChange={e => setApiToken(e.target.value)}
                                className="glossy-input rounded-lg px-4 py-2 w-48 text-sm"
                            />
                            <button onClick={handleConnect} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                                <IconWifi /> {connStatus === "Connected" || connStatus === "Live Trading" ? "Re-Connect" : "Connect API"}
                            </button>
                            <div className={`px-3 py-1 rounded-full text-xs font-bold border ${connStatus === "Live Trading" ? "bg-emerald-500/20 border-emerald-500 text-emerald-400" : connStatus === "Connected" ? "bg-blue-500/20 border-blue-500 text-blue-400" : "bg-red-500/20 border-red-500 text-red-400"}`}>
                                {connStatus}
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* LEFT PANEL */}
                        <div className="lg:col-span-4 flex flex-col gap-6">
                            <div className="glass-panel rounded-2xl p-5">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 border-b border-gray-700 pb-2">
                                    <IconSettings /> Setup Market & Strategi
                                </h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-sm text-gray-400 mb-1 block">Pilih Market Index</label>
                                        <select 
                                            value={market} onChange={e => setMarket(e.target.value)}
                                            className="w-full glossy-input rounded-lg px-4 py-3 appearance-none font-semibold text-yellow-500"
                                        >
                                            <option value="Crash 300">Crash 300 Index</option>
                                            <option value="Crash 500">Crash 500 Index</option>
                                            <option value="Crash 1000">Crash 1000 Index</option>
                                            <option value="Boom 500">Boom 500 Index</option>
                                            <option value="Boom 1000">Boom 1000 Index</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="text-sm text-gray-400 mb-1 block">Metode Strategi Bot</label>
                                        <select 
                                            value={strategy} onChange={e => setStrategy(e.target.value)}
                                            className="w-full glossy-input rounded-lg px-4 py-3 appearance-none"
                                        >
                                            <option value="1">Metode 1: Scalping & Auto TP Spike</option>
                                            <option value="2">Metode 2: Follow Trend & Reversal 5 Candle</option>
                                            <option value="3">Metode 3: Counter-Spike (Catching Spike)</option>
                                        </select>
                                        <div className="mt-2 text-xs text-gray-400 bg-black/30 p-3 rounded-lg border border-gray-700">
                                            {strategy === "1" && `Bot akan OP ${market.includes("Boom") ? "FALL" : "RISE"} mengikuti candle normal. Jika terdeteksi Spike, otomatis trigger Close instant (Cut).`}
                                            {strategy === "2" && `Bot mengikuti tren. Jika ada 5 candle normal berturut-turut, bot otomatis OP ${market.includes("Boom") ? "CALL" : "PUT"} (Reversal).`}
                                            {strategy === "3" && `Hanya mencari momen spike. Bot akan OP ${market.includes("Boom") ? "CALL" : "PUT"} saat indikator jenuh tercapai.`}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel rounded-2xl p-5">
                                <h2 className="text-lg font-bold mb-4 border-b border-gray-700 pb-2">Money Management</h2>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2">
                                        <label className="text-sm text-gray-400 block mb-1">Stake Awal (USD)</label>
                                        <input type="number" value={stake} onChange={e => setStake(Number(e.target.value))} className="w-full glossy-input rounded-lg px-4 py-2 font-mono text-lg" step="0.5" />
                                    </div>
                                    <div className="col-span-2 flex items-center justify-between bg-black/20 p-3 rounded-lg">
                                        <span className="text-sm text-gray-300">Aktifkan Martingale (x2.0)</span>
                                        <button onClick={() => setMartingale(!martingale)} className={`w-12 h-6 rounded-full relative transition-colors ${martingale ? 'bg-emerald-500' : 'bg-gray-600'}`}>
                                            <div className={`absolute top-1 w-4 h-4 rounded-full bg-white transition-all ${martingale ? 'left-7' : 'left-1'}`}></div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* MIDDLE & RIGHT PANELS */}
                        <div className="lg:col-span-8 flex flex-col gap-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="glass-panel p-4 rounded-2xl text-center">
                                    <p className="text-sm text-gray-400">Real Balance</p>
                                    <p className="text-3xl font-bold text-white font-mono mt-1">
                                        {balance > 0 ? `${currency} ${balance.toFixed(2)}` : "0.00"}
                                    </p>
                                </div>
                                <div className="glass-panel p-4 rounded-2xl text-center">
                                    <p className="text-sm text-gray-400">Total Net Profit</p>
                                    <p className={`text-3xl font-bold font-mono mt-1 ${totalNetProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                        ${totalNetProfit.toFixed(2)}
                                    </p>
                                </div>
                                <div className="glass-panel p-4 rounded-2xl text-center">
                                    <p className="text-sm text-gray-400">Win Rate</p>
                                    <p className="text-3xl font-bold text-yellow-400 font-mono mt-1">{winRate}%</p>
                                </div>
                            </div>

                            <div className="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center py-8 relative overflow-hidden">
                                <div className="absolute inset-0 bg-gradient-to-b from-transparent to-black/50 pointer-events-none"></div>
                                <h3 className="text-sm font-bold text-gray-400 mb-2 uppercase tracking-widest z-10">Live Engine Status</h3>
                                <div className={`text-2xl md:text-4xl font-black mb-6 z-10 px-6 py-2 rounded-xl border ${
                                    signal.includes("SPIKE") ? "text-red-500 border-red-500/50 bg-red-500/10" : 
                                    signal.includes("REVERSAL") || signal.includes("SCALPING") ? "text-emerald-400 border-emerald-500/50 bg-emerald-500/10" : 
                                    "text-yellow-500 border-yellow-500/50 bg-yellow-500/10"
                                }`}>
                                    {signal}
                                </div>
                                
                                <button onClick={toggleBot} className={`z-10 w-64 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-2xl transition-all transform hover:scale-105 active:scale-95 ${
                                    isBotRunning 
                                    ? "bg-gradient-to-r from-red-600 to-red-800 hover:from-red-500 hover:to-red-700" 
                                    : "bg-gradient-to-r from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600"
                                }`}>
                                    {isBotRunning ? <IconSquare /> : <IconPlay />}
                                    {isBotRunning ? "STOP BOT ENGINE" : "START BOT ENGINE"}
                                </button>
                                
                                <div className="w-full mt-6 z-10">
                                    <p className="text-xs text-gray-500 mb-1">Live Tick Stream (WebSocket): {market}</p>
                                    {renderChart()}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
